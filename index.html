    <script>
document.addEventListener('keydown', function(e) {
    // F12 키 차단
    if (e.key === 'F12') {
        e.preventDefault();
    }
    // Ctrl + Shift + I (검사 도구) 차단
    if (e.ctrlKey && e.shiftKey && e.key === 'I') {
        e.preventDefault();
    }
    // Ctrl + Shift + C (요소 검사) 차단
    if (e.ctrlKey && e.shiftKey && e.key === 'C') {
        e.preventDefault();
    }
    // Ctrl + U (소스 보기) 차단
    if (e.ctrlKey && e.key === 'u') {
        e.preventDefault();
    }
    // Ctrl + S (저장) 차단
    if (e.ctrlKey && e.key === 's') {
        e.preventDefault();
    }
});
</script>
